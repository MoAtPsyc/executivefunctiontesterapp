<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Executive Function Tester</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: #111;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: manipulation;
    }
    #game { position: fixed; inset: 0; }
    canvas { display: block; touch-action: manipulation; }
  </style>

  <!-- Force fresh JS every load — local dev only -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
</head>
<body>
  <div id="game"></div>

  <!-- Phaser 3 from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>

  <!-- Cache-busted local scripts (timestamp injected at load time) -->
  <script>
    const _v = "?v=" + Date.now();
    const _scripts = [
      "runtime/gvars.js",
      "runtime/h.js",
      "runtime/sizing.js",
      "runtime/instructions.js",
      "scenes/LoadingScene.js",
      "scenes/GameScene.js",
      "scenes/HudScene.js",
      "scenes/EndScene.js",
      "main.js",
    ];
    _scripts.forEach((src) => {
      document.write('<script src="' + src + _v + '"><\/script>');
    });
  </script>
</body>
</html>
